[platformio]
src_dir = .
; ── HOW TO SWITCH BOARDS ──────────────────────────────────────────────────
; 1. Click the environment name in the VS Code bottom status bar (e.g. "esp32")
; 2. Select the one that matches your connected board
; 3. Click Upload — PlatformIO auto-detects the COM port
; ─────────────────────────────────────────────────────────────────────────
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
; upload_port auto-detected — no need to hardcode
upload_speed = 921600
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2

[env:uno]
platform = atmelavr
board = uno
framework = arduino
; upload_port auto-detected — no need to hardcode
upload_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
; upload_port auto-detected — no need to hardcode
upload_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
