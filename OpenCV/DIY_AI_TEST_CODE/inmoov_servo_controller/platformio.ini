[platformio]
src_dir = .
build_dir = C:/pio_build
; ── HOW TO SWITCH BOARDS ──────────────────────────────────────────────────
; 1. Change default_envs below (esp32, uno, or megaatmega2560)
; 2. Click Upload — PlatformIO auto-detects the COM port
; ─────────────────────────────────────────────────────────────────────────
default_envs = uno

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
upload_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2